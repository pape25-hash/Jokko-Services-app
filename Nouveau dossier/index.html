<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jokko Services — Employeurs &amp; employés à domicile, en confiance</title>

<!-- PWA : permet "Ajouter à l'écran d'accueil" sur Android et iOS -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#059669">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jokko">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --ink:#0F172A;
    --ink-2:#475569;
    --paper:#F8FAFC;
    --paper-2:#F1F5F9;
    --marigold:#059669;
    --marigold-dark:#047857;
    --teal:#059669;
    --teal-dark:#047857;
    --clay:#DC2626;
    --ink-text:#0F172A;
    --paper-text:#F8FAFC;
    --line: rgba(15,23,42,0.16);
    --line-light: rgba(248,250,252,0.22);
    --radius: 10px;
    --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 20px rgba(15,23,42,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink-text);
    font-family:'Inter', sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Inter', sans-serif;
    font-weight:600;
    color:var(--ink);
    margin:0;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--teal);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---- Layout shells ---- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    background:var(--ink);
    color:var(--paper-text);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:8px;
    background:var(--marigold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;font-weight:700;color:#fff;
    font-size:18px;
    flex-shrink:0;
  }
  .brand-name{font-family:'Inter',sans-serif;font-weight:700;font-size:20px;letter-spacing:-0.2px;}
  .brand-tag{font-size:11px;color:#34D399;text-transform:uppercase;letter-spacing:1.2px;}
  .nav{display:flex;gap:6px;flex-wrap:wrap;}
  .nav button{
    background:transparent;color:var(--paper-text);
    border:1px solid var(--line-light);
    padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;
    transition:background .15s ease;
  }
  .nav button i{ margin-right:6px; font-size:12.5px; }
  .nav button.active{background:var(--marigold);color:#fff;border-color:var(--marigold);font-weight:600;}
  .nav button:hover:not(.active){background:rgba(248,250,252,0.1);}

  main{flex:1;padding:28px 20px 60px;max-width:1080px;margin:0 auto;width:100%;}
  .footer-note{
    text-align:center;font-size:12px;color:var(--ink);opacity:0.6;
    padding:18px 20px 26px;max-width:640px;margin:0 auto;
  }
  .footer-note a{text-decoration:underline;cursor:pointer;}

  /* ---- Welcome / auth ---- */
  .hero{
    display:grid;grid-template-columns:1.1fr 0.9fr;gap:36px;align-items:center;
    padding:20px 0 40px;
  }
  @media (max-width:820px){ .hero{grid-template-columns:1fr;} }
  .hero h1{font-size:clamp(30px,4.2vw,46px);line-height:1.08;}
  .hero .lede{margin-top:14px;font-size:17px;color:var(--ink-2);max-width:46ch;}
  .eyebrow{
    display:inline-block;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--teal-dark);font-weight:700;margin-bottom:10px;
  }
  .stat-row{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap;}
  .stat{border-left:2px solid var(--marigold);padding-left:10px;}
  .stat b{font-family:'Inter',sans-serif;font-weight:700;font-size:22px;display:block;}
  .stat span{font-size:12px;color:var(--ink-2);}

  /* signature: the "carte" — an official-looking ID/skills card */
  .id-card{
    background:#fff;
    color:var(--ink-text);
    border-radius:16px;
    padding:22px 22px 18px;
    position:relative;
    border:1px solid var(--line);
    box-shadow:var(--shadow);
  }
  .id-card .stamp{
    position:absolute;top:16px;right:18px;
    background:rgba(5,150,105,0.1);color:var(--marigold-dark);
    border-radius:999px;padding:5px 12px;font-size:10px;font-weight:700;
    letter-spacing:0.6px;text-transform:uppercase;
  }
  .id-card .id-eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--marigold-dark);font-weight:700;}
  .id-card h3{color:var(--ink);font-size:22px;margin-top:8px;}
  .id-card .id-role{font-size:13px;color:var(--ink-2);margin-top:2px;}
  .id-card .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .id-card .chip{
    background:var(--paper-2);border:1px solid var(--line);
    color:var(--ink-2);font-size:12px;padding:4px 10px;border-radius:999px;
  }
  .id-card .id-foot{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
    font-size:12px;color:var(--ink-2);
  }

  /* ---- Cards / sections ---- */
  .card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin-bottom:16px;
  }
  .card h2{font-size:20px;margin-bottom:4px;}
  .muted{color:var(--ink-2);font-size:14px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:640px){.grid-2{grid-template-columns:1fr;}}

  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--ink);}
  input[type=text],input[type=number],input[type=tel],select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:14px;background:var(--paper);color:var(--ink-text);
  }
  textarea{min-height:90px;resize:vertical;}
  .field-hint{font-size:12px;color:var(--ink-2);margin-top:4px;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--marigold);color:#fff;}
  .btn-primary:hover{background:var(--marigold-dark);}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-teal:hover{background:var(--teal-dark);}
  .btn-outline{background:transparent;border:1.5px solid var(--ink);color:var(--ink);}
  .btn-ghost{background:transparent;color:var(--teal-dark);text-decoration:underline;padding:6px 4px;}
  .btn-danger{background:transparent;border:1.5px solid var(--clay);color:var(--clay);}
  .btn[disabled]{opacity:0.45;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

  .chip-select{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .chip-opt{
    padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);
    font-size:13px;background:#fff;color:var(--ink-2);
  }
  .chip-opt.on{background:var(--teal);border-color:var(--teal);color:#fff;}

  .suggestion-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .suggestion-chip{
    padding:6px 12px;border-radius:10px;border:1.5px dashed var(--teal);
    background:rgba(5,150,105,0.06);color:var(--teal-dark);font-size:12.5px;text-align:left;
  }
  .suggestion-chip:hover{background:rgba(5,150,105,0.14);}

  .photo-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .photo-thumb{position:relative;width:88px;height:88px;border-radius:12px;overflow:hidden;border:1px solid var(--line);flex-shrink:0;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .rm-btn{
    position:absolute;top:3px;right:3px;background:rgba(15,23,42,0.75);color:#fff;
    border-radius:999px;width:20px;height:20px;font-size:12px;line-height:20px;text-align:center;padding:0;
  }
  .photo-add-btn{
    width:88px;height:88px;border-radius:12px;border:1.5px dashed var(--line);
    background:var(--paper-2);display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:22px;color:var(--ink-2);flex-shrink:0;gap:2px;
  }
  .photo-add-btn span{font-size:10px;}
  .avatar-circle{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .avatar-circle-fallback{
    width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Inter',sans-serif;flex-shrink:0;
  }
  .gallery-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
  .gallery-row .g-thumb{
    position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;
    border:1px solid var(--line);display:inline-block;cursor:zoom-in;
  }
  .gallery-row .g-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .gallery-row .g-thumb .g-zoom{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(15,23,42,0.35);color:#fff;font-size:16px;opacity:0;transition:opacity .18s ease;
  }
  .gallery-row .g-thumb:hover .g-zoom{opacity:1;}
  .lightbox-overlay{background:rgba(15,23,42,0.82);flex-direction:column;}
  .lightbox-img{max-width:min(90vw,560px);max-height:80vh;border-radius:12px;animation:scaleIn .22s cubic-bezier(.2,.8,.3,1.2);}
  .lightbox-close{position:fixed;top:20px;right:20px;background:rgba(255,255,255,0.12);color:#fff;}

  .badge{
    display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
    text-transform:uppercase;letter-spacing:0.5px;
  }
  .badge-active{background:rgba(5,150,105,0.14);color:var(--teal-dark);}
  .badge-inactive{background:rgba(220,38,38,0.12);color:var(--clay);}
  .badge-verified{background:rgba(5,150,105,0.18);color:var(--marigold-dark);}

  /* Profile / job list */
  .listing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .plink{
    display:block;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;position:relative;
  }
  .plink:hover{box-shadow:var(--shadow);}
  .plink .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .plink h3{font-size:17px;}
  .plink .service{font-size:12px;color:var(--teal-dark);font-weight:600;margin-top:2px;}
  .plink .meta{font-size:12px;color:var(--ink-2);margin-top:8px;}
  .plink .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
  .plink .chips span{font-size:11px;background:var(--paper-2);padding:3px 8px;border-radius:999px;color:var(--ink-2);}

  .blur-wrap{position:relative;}
  .blur-wrap .blur-target{filter:blur(5px);pointer-events:none;user-select:none;}
  .blur-cta{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(250,246,236,0.4);border-radius:var(--radius);
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,0.55);
    display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;
  }
  .modal{
    background:#fff;border-radius:16px;max-width:520px;width:100%;
    max-height:86vh;overflow-y:auto;padding:24px;position:relative;
  }
  .modal-close{position:absolute;top:14px;right:16px;font-size:20px;background:none;color:var(--ink-2);}

  /* messages */
  .req-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .req-row:last-child{border-bottom:none;}
  .conv-list button.conv-item{
    width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:12px;margin-bottom:8px;font-size:14px;
  }
  .chat-box{display:flex;flex-direction:column;height:400px;}
  .chat-msgs{flex:1;overflow-y:auto;padding:10px;background:var(--paper-2);border-radius:10px;display:flex;flex-direction:column;gap:8px;}
  .msg{max-width:75%;padding:8px 12px;border-radius:12px;font-size:14px;}
  .msg.me{align-self:flex-end;background:var(--teal);color:#fff;}
  .msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line);}
  .chat-input-row{display:flex;gap:8px;margin-top:10px;}
  .chat-input-row input{flex:1;}

  .empty-state{
    text-align:center;padding:34px 16px;color:var(--ink-2);
  }
  .spinner-line{font-size:13px;color:var(--ink-2);padding:20px 0;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;}

  /* ---- Animations (style cohérent sur toute la structure) ---- */
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes pop{ 0%{transform:scale(0.9);} 60%{transform:scale(1.06);} 100%{transform:scale(1);} }
  @keyframes floaty{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);} }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  main{ animation: fadeInUp .32s ease; }
  .card, .plink, .id-card{ animation: fadeIn .35s ease; }
  .topbar{ animation: fadeIn .25s ease; }
  .id-card{ animation: fadeIn .4s ease; }
  .chip-opt.on{ animation: pop .22s ease; }
  .plink{ transition: transform .15s ease, box-shadow .15s ease; }
  .plink:hover{ transform:translateY(-3px); }
  .btn{ transition: transform .12s ease, box-shadow .12s ease, background .15s ease; }
  .btn:hover:not([disabled]){ transform:translateY(-1px); box-shadow:0 4px 10px rgba(15,23,42,0.14); }
  .btn:active:not([disabled]){ transform:translateY(0) scale(0.98); box-shadow:none; }
  .nav button{ transition: background .15s ease, transform .12s ease; }
  .nav button:active{ transform:scale(0.96); }
  .brand{ transition: transform .15s ease; }
  .brand:hover{ transform:translateY(-1px); }
  .modal{ animation: fadeInUp .25s ease; }
  .overlay{ animation: fadeIn .18s ease; }

  .spin-ring{
    width:16px;height:16px;border-radius:50%;
    border:2.5px solid var(--line);border-top-color:var(--teal);
    animation: spin .7s linear infinite;
    flex-shrink:0;
  }

  /* ---- Défilement (ticker de confiance) ---- */
  @keyframes marquee{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .ticker-wrap{
    background:var(--ink); overflow:hidden; white-space:nowrap;
    border-bottom:1px solid rgba(248,250,252,0.08);
  }
  .ticker-track{
    display:inline-flex; align-items:center; gap:36px;
    padding:8px 0; animation:marquee 22s linear infinite;
  }
  .ticker-track span{
    color:rgba(248,250,252,0.75); font-size:12.5px; font-weight:500;
    display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
  }
  .ticker-track i{ color:#34D399; font-size:12px; }
  .ticker-wrap:hover .ticker-track{ animation-play-state:paused; }

  /* ---- Zoom au survol ---- */
  .photo-thumb img, .gallery-row img{ transition:transform .25s ease; }
  .photo-thumb:hover img, .gallery-row img:hover{ transform:scale(1.08); }
  .avatar-circle, .avatar-circle-fallback{ transition:transform .2s ease; }
  .plink:hover .avatar-circle, .plink:hover .avatar-circle-fallback{ transform:scale(1.08); }
  .id-card{ transition:transform .25s ease, box-shadow .25s ease; }
  .id-card:hover{ transform:scale(1.015); box-shadow:0 4px 8px rgba(15,23,42,0.06), 0 16px 32px rgba(15,23,42,0.1); }
  .plink{ transform:scale(1); }
  .plink:hover{ transform:translateY(-3px) scale(1.012); }

  /* ---- Transitions d'entrée / sortie ---- */
  @keyframes scaleIn{ from{opacity:0; transform:scale(0.94) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);} }
  @keyframes scaleOut{ from{opacity:1; transform:scale(1) translateY(0);} to{opacity:0; transform:scale(0.94) translateY(6px);} }
  @keyframes overlayOut{ from{opacity:1;} to{opacity:0;} }
  @keyframes toastOut{ from{opacity:1; transform:translate(-50%,0);} to{opacity:0; transform:translate(-50%,10px);} }
  .modal{ animation: scaleIn .22s cubic-bezier(.2,.8,.3,1.2); }
  .overlay.closing{ animation: overlayOut .18s ease forwards; }
  .overlay.closing .modal, .overlay.closing .lightbox-img{ animation: scaleOut .18s ease forwards; }
  .toast-msg.leaving{ animation: toastOut .28s ease forwards; }
  .icon-badge{
    width:34px;height:34px;border-radius:9px;background:var(--paper-2);
    display:inline-flex;align-items:center;justify-content:center;color:var(--marigold-dark);
    font-size:15px;flex-shrink:0;
  }
  .empty-illustration{ color:var(--line); font-size:34px; margin-bottom:10px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   JOKKO SERVICES — app complète (front-end + backend Node/MongoDB)
   Mise en relation nounous / femmes de ménage / domestiques
   =========================================================
   ARCHITECTURE :
   - Ce fichier (front-end) appelle une vraie API (/api/...) servie
     par server.js, qui lit/écrit dans MongoDB (voir models.js).
   - L'authentification utilise un mot de passe (haché avec bcrypt)
     et une session persistante (cookie httpOnly, stockée aussi
     dans MongoDB) : un utilisateur reste connecté après avoir
     fermé puis rouvert son navigateur, jusqu'à déconnexion.
   - Les paiements passent par PayTech (server.js), avec confirmation
     officielle uniquement via le webhook IPN vérifié — jamais via
     un simple retour d'URL, qui pourrait être falsifié.
   - Voir .env.example pour les variables à configurer avant de
     déployer (MONGODB_URI, SESSION_SECRET, clés PayTech...).
   ========================================================= */

const SERVICE_TYPES = ["Nounou / Garde d'enfants","Ménage","Cuisine","Garde de personnes âgées","Repassage","Toutes tâches ménagères","Jardinage","Bricolage / Petits travaux","Chauffeur particulier","Garde de nuit","Sécurité / Gardiennage","Coursier / Courses","Coiffure & beauté à domicile","Coach sportif à domicile"];
const SERVICE_ICONS = {
  "Nounou / Garde d'enfants": "fa-baby",
  "Ménage": "fa-broom",
  "Cuisine": "fa-utensils",
  "Garde de personnes âgées": "fa-hand-holding-heart",
  "Repassage": "fa-shirt",
  "Toutes tâches ménagères": "fa-house-chimney-window",
  "Jardinage": "fa-seedling",
  "Bricolage / Petits travaux": "fa-screwdriver-wrench",
  "Chauffeur particulier": "fa-car",
  "Garde de nuit": "fa-moon",
  "Sécurité / Gardiennage": "fa-shield-halved",
  "Coursier / Courses": "fa-basket-shopping",
  "Coiffure & beauté à domicile": "fa-scissors",
  "Coach sportif à domicile": "fa-dumbbell",
};
function serviceIcon(name){ return SERVICE_ICONS[name] || 'fa-briefcase'; }
const TRAITS = ["Calme","Dynamique","Patiente","Discrète","Ponctuelle","Rigoureuse","Souriante","Autonome","Bonne présentation","Sens de l'organisation"];
const SKILLS = ["Cuisine sénégalaise","Cuisine internationale","Repassage","Lessive à la main","Garde de bébé (0-2 ans)","Garde d'enfants (3-10 ans)","Aide aux devoirs","Garde de personnes âgées","Premiers secours","Conduite (permis B)","Ménage en profondeur","Gestion des courses"];
const CITIES = ["Dakar","Pikine","Guédiawaye","Rufisque","Thiès","Mbour","Saint-Louis","Touba","Kaolack","Ziguinchor","Diourbel","Louga","Tambacounda","Kolda"];
const AVAILABILITIES = ["Temps plein","Mi-temps","Journalière / Ponctuel","Logée (vit chez l'employeur)"];
const SUB_PRICE_WORKER = 1000;
const SUB_PRICE_EMPLOYER = 2000;
const MAX_PHOTOS = 3;
// PayTech exige que la clé API et la clé secrète restent CÔTÉ SERVEUR (jamais dans ce fichier
// front-end). Ce fichier appelle donc /api/create-paytech-payment sur notre propre serveur
// (voir server.js), qui lui appelle PayTech avec les vraies clés.

/* ---------- API helpers (vrai serveur, remplace window.storage) ---------- */
async function api(method, path, body){
  const opts = { method, credentials:'include', headers:{} };
  if(body !== undefined){
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  let data = null;
  try{ data = await res.json(); }catch(e){ /* réponse vide, ok pour ex. logout */ }
  if(!res.ok){
    const err = new Error((data && data.message) || ('Erreur '+res.status));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}
function pairKey(a,b){ return [a,b].sort().join('__'); }

/* ---------- toast ---------- */
function showToast(msg){
  state.toast = msg; state.toastLeaving = false; render();
  setTimeout(()=>{ state.toastLeaving = true; render(); }, 2200);
  setTimeout(()=>{ state.toast=null; state.toastLeaving=false; render(); }, 2500);
}

/* ---------- render dispatcher ---------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${Topbar()}
    ${TrustTicker()}
    <main>${ViewBody()}</main>
    ${FooterNote()}
    ${state.toast ? `<div class="toast-msg ${state.toastLeaving?'leaving':''}" style="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper-text);padding:12px 20px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);z-index:80;animation:toastIn .25s ease;">${escapeHtml(state.toast)}</div>` : ''}
    ${state.detailItem ? DetailModal() : ''}
    ${state.lightboxSrc ? LightboxOverlay() : ''}
  `;
}
function TrustTicker(){
  const items = [
    '<i class="fa-solid fa-star"></i>Jokko — La confiance, à portée de clic',
    ...SERVICE_TYPES.map(s => `<i class="fa-solid ${serviceIcon(s)}"></i>${s}`),
    '<i class="fa-solid fa-shield-halved"></i>Paiement sécurisé via PayTech (Orange Money, Wave, Free Money, carte)',
  ];
  const row = items.map(i=>`<span>${i}</span>`).join('');
  return `<div class="ticker-wrap"><div class="ticker-track">${row}${row}</div></div>`;
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function goTo(view){
  state.view = view;
  render();
  if(view==='browse') loadBrowseResults();
  if(view==='requests') loadRequests();
  if(view==='messages') loadConversations();
  if(view==='profile-edit') initProfileDraft();
  if(view==='jobpost-edit') initJobpostDraft();
}

/* ---------- view body ---------- */
function ViewBody(){
  switch(state.view){
    case 'welcome': return WelcomeView();
    case 'register': return RegisterView();
    case 'dashboard': return DashboardView();
    case 'profile-edit': return ProfileEditView();

function escAttr(s){ return String(s).replace(/'/g,"\\'"); }
function appendSuggestion(textareaId, text){
  const ta = document.getElementById(textareaId);
  if(!ta) return;
  const cur = ta.value.trim();
  ta.value = cur ? cur + ' ' + text : text;
  ta.focus();
}
function triggerPhotoInput(draftKey){
  const el = document.getElementById('photo-input-'+draftKey);
  if(el) el.click();
}
function removePhoto(draftKey, idx){
  state[draftKey].photos.splice(idx,1);
  render();
}
async function handlePhotoSelect(event, draftKey){
  const files = Array.from(event.target.files || []);
  const draft = state[draftKey];
  for(const file of files){
    if(draft.photos.length >= MAX_PHOTOS){ showToast('Maximum '+MAX_PHOTOS+' photos.'); break; }
    try{
      const dataUrl = await resizeImageFile(file);
      draft.photos.push(dataUrl);
    }catch(e){ showToast("Impossible de charger cette image."); }
  }
  event.target.value = '';
  render();
}
function resizeImageFile(file){
  return new Promise((resolve, reject)=>{
    if(!file.type || file.type.indexOf('image/')!==0){ reject(new Error('not an image')); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('decode failed'));
      img.onload = ()=>{
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL('image/jpeg', 0.72)); }
        catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function toggleChip(draftKey, field, value){
  const d = state[draftKey];
  const i = d[field].indexOf(value);
  if(i>=0) d[field].splice(i,1); else d[field].push(value);
  render();
}

  state.jobpostDraft = existing || {
    name: me.name, phone: me.phone, city:'', service:'', availability:'', budget:'', description:'', photos:[]
  };
  if(!state.jobpostDraft.photos) state.jobpostDraft.photos = [];
  render();
}
function JobpostEditView(){
  if(!state.jobpostDraft){ return `<div class="spinner-line"><div class="spin-ring"></div>Chargement…</div>`; }
  const d = state.jobpostDraft;
  return `
  <div class="card">
    <h2>Ma demande</h2>
    <p class="muted">Décrivez le type d'aide recherchée pour attirer les bons profils.</p>

    <label>Photos (3 maximum — ex. la maison, un moment en famille)</label>
    <div class="photo-grid">
      ${d.photos.map((p,i)=>`
        <div class="photo-thumb">
          <img src="${p}" alt="Photo ${i+1}">
          <button type="button" class="rm-btn" onclick="removePhoto('jobpostDraft', ${i})" aria-label="Supprimer la photo"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>`).join('')}
      ${d.photos.length < MAX_PHOTOS ? `
        <button type="button" class="photo-add-btn" onclick="triggerPhotoInput('jobpostDraft')">
          <i class="fa-solid fa-camera" style="font-size:18px;" aria-hidden="true"></i><span>Ajouter</span>
        </button>` : ''}
    </div>
    <input type="file" accept="image/*" id="photo-input-jobpostDraft" style="display:none" multiple onchange="handlePhotoSelect(event,'jobpostDraft')">
    <div class="field-hint">Optionnel, mais rassure les candidat(e)s.</div>

    <label>Ville</label>
    <select id="jp-city">
      <option value="">Choisir une ville</option>
      ${CITIES.map(c=>`<option value="${c}" ${d.city===c?'selected':''}>${c}</option>`).join('')}
    </select>

    <label>Type d'aide recherchée</label>
    <select id="jp-service">
      <option value="">Choisir</option>
      ${SERVICE_TYPES.map(s=>`<option value="${s}" ${d.service===s?'selected':''}>${s}</option>`).join('')}
    </select>

    <label>Disponibilité recherchée</label>
    <select id="jp-avail">
      <option value="">Choisir</option>
      ${AVAILABILITIES.map(a=>`<option value="${a}" ${d.availability===a?'selected':''}>${a}</option>`).join('')}
    </select>

    <label>Budget (FCFA / mois)</label>
    <input type="number" min="0" id="jp-budget" value="${d.budget}">

    <label>Description</label>
    <textarea id="jp-desc" placeholder="Ex : « Nous cherchons une nounou pour deux enfants (3 et 6 ans), du lundi au vendredi, quartier calme. »">${escapeHtml(d.description)}</textarea>
    <div class="field-hint">Besoin d'inspiration ? Cliquez pour ajouter une phrase :</div>
    <div class="suggestion-list">
      ${JOB_DESC_SUGGESTIONS.map(s=>`<button type="button" class="suggestion-chip" onclick="appendSuggestion('jp-desc','${escAttr(s)}')">+ ${s}</button>`).join('')}
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="saveJobpost()">Enregistrer ma demande</button>
    </div>
  </div>`;
}
async function saveJobpost(){
  const d = state.jobpostDraft;
  d.city = document.getElementById('jp-city').value;
  d.service = document.getElementById('jp-service').value;
  d.availability = document.getElementById('jp-avail').value;
  d.budget = document.getElementById('jp-budget').value;
  d.description = document.getElementById('jp-desc').value;
  try{
    await api('PUT', '/api/jobpost', d);
    showToast('Demande enregistrée.');
    goTo('dashboard');
  }catch(e){ showToast(e.message || 'Enregistrement impossible.'); }
}

/* ---------- BROWSE ---------- */
function BrowseView(){
  const me = state.currentUser;
  const lookingFor = me.role==='travailleur' ? 'demandes des employeurs' : 'profils disponibles';
  return `
  <div class="card">
    <h2>Rechercher — ${lookingFor}</h2>
    <div class="grid-2">
      <div>
        <label>Type de service</label>
        <select id="f-service" onchange="setFilter('service', this.value)">
          <option value="">Tous</option>
          ${SERVICE_TYPES.map(s=>`<option value="${s}" ${state.browseFilters.service===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Ville</label>
        <select id="f-city" onchange="setFilter('city', this.value)">
          <option value="">Toutes</option>
          ${CITIES.map(c=>`<option value="${c}" ${state.browseFilters.city===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
    </div>
  </div>
  <div id="browse-results">${state.browseLoading ? '<div class="spinner-line"><div class="spin-ring"></div>Recherche en cours…</div>' : renderBrowseResults()}</div>
  `;
}
function setFilter(key, val){ state.browseFilters[key]=val; loadBrowseResults(); }
async function loadBrowseResults(){
  state.browseLoading = true;
  const f = state.browseFilters;
  const params = new URLSearchParams();
  if(f.city) params.set('city', f.city);
  if(f.service) params.set('service', f.service);
  try{
    const data = await api('GET', '/api/browse?'+params.toString());
    state.browseResults = data.results || [];
    state.iAmSubscribed = !!data.iAmSubscribed;
  }catch(e){
    state.browseResults = [];
    state.iAmSubscribed = false;
  }
  state.browseLoading = false;
  const root = document.getElementById('browse-results');
  if(root) root.innerHTML = renderBrowseResults();
  else render();
}
function renderBrowseResults(){
  const me = state.currentUser;
  const items = state.browseResults || [];
  if(items.length===0){
    return `<div class="empty-state"><div class="empty-illustration"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></div>Aucun résultat pour l'instant. Revenez bientôt, ou élargissez vos filtres.</div>`;
  }
  function avatarHtml(it){
    const photo = (it.photos && it.photos[0]) ? it.photos[0] : null;
    const initial = (it.name||'?').trim().charAt(0).toUpperCase();
    return photo
      ? `<img class="avatar-circle" src="${photo}" alt="Photo de ${escapeHtml(it.name)}">`
      : `<div class="avatar-circle-fallback">${initial}</div>`;
  }
  const cardsHtml = items.map((it,idx)=>{
    if(me.role==='travailleur'){
      return `<button class="plink" onclick="openDetail(${idx})">
        <div class="top-row">${avatarHtml(it)}<h3 style="margin-top:6px;">${escapeHtml(it.name)}</h3></div>
        <div class="service">${escapeHtml(it.service||'—')}</div>
        <div class="meta">${escapeHtml(it.city||'—')} · Budget : ${it.budget? Number(it.budget).toLocaleString('fr-FR')+' FCFA/mois' : '—'}</div>
      </button>`;
    } else {
      return `<button class="plink" onclick="openDetail(${idx})">
        <div class="top-row">${avatarHtml(it)}<span class="badge badge-verified"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Profil</span></div>
        <h3 style="margin-top:6px;">${escapeHtml(it.name)}</h3>
        <div class="service">${(it.services||[]).join(', ')||'—'}</div>
        <div class="meta">${escapeHtml(it.city||'—')} · ${it.salary? Number(it.salary).toLocaleString('fr-FR')+' FCFA/mois' : '—'}</div>
        <div class="chips">${(it.traits||[]).slice(0,3).map(t=>`<span>${t}</span>`).join('')}</div>
      </button>`;
    }
  }).join('');

  if(!state.iAmSubscribed){
    return `<div class="card" style="margin-bottom:14px;">
        <span class="badge badge-inactive">Visibilité inactive</span>
        <p class="muted" style="margin-top:8px;">Vous pouvez consulter un aperçu, mais activez votre visibilité pour voir les coordonnées complètes et envoyer une demande de mise en relation.</p>
        <div class="btn-row"><button class="btn btn-primary" onclick="goTo('dashboard')">Activer ma visibilité</button></div>
      </div>
      <div class="blur-wrap"><div class="listing-grid blur-target">${cardsHtml}</div></div>`;
  }
  return `<div class="listing-grid">${cardsHtml}</div>`;
}
function openDetail(idx){
  state.detailItem = { data: state.browseResults[idx], isWorkerRole: state.currentUser.role==='travailleur' };
  render();
}
function closeDetail(){
  const el = document.getElementById('detail-overlay');
  if(el){ el.classList.add('closing'); setTimeout(()=>{ state.detailItem=null; render(); }, 180); }
  else { state.detailItem=null; render(); }
}
function DetailModal(){
  const { data, isWorkerRole } = state.detailItem;
  const targetPhone = data.phone;
  const gallery = (data.photos && data.photos.length)
    ? `<div class="gallery-row">${data.photos.map((p,i)=>`<span class="g-thumb" onclick="openLightbox('${escAttr(p)}')"><img src="${p}" alt="Photo ${i+1} de ${escapeHtml(data.name)}"><i class="fa-solid fa-magnifying-glass-plus g-zoom" aria-hidden="true"></i></span>`).join('')}</div>`
    : '';
  const body = isWorkerRole
    ? `
      <span class="eyebrow">Demande d'un employeur</span>
      <h2>${escapeHtml(data.name)}</h2>
      <p class="muted">${escapeHtml(data.city||'—')} · ${escapeHtml(data.service||'—')}</p>
      <p style="margin-top:10px;">${escapeHtml(data.description||'Aucune description fournie.')}</p>
      <p class="muted" style="margin-top:10px;">Budget : <b>${data.budget? Number(data.budget).toLocaleString('fr-FR')+' FCFA/mois' : '—'}</b></p>
      <p class="muted">Disponibilité recherchée : ${escapeHtml(data.availability||'—')}</p>
    `
    : `
      <span class="eyebrow">Carte de profil</span>
      <h2>${escapeHtml(data.name)}</h2>
      <p class="muted">${escapeHtml(data.city||'—')} · ${(data.services||[]).join(', ')}</p>
      <div class="chips" style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;">
        ${(data.traits||[]).map(t=>`<span class="badge" style="background:var(--paper-2);color:var(--ink-2);">${t}</span>`).join('')}
      </div>
      <p><b>Compétences :</b> ${(data.skills||[]).join(', ')||'—'}</p>
      <p style="margin-top:8px;">${escapeHtml(data.bio||'')}</p>
      <p class="muted" style="margin-top:10px;">Expérience : ${escapeHtml(String(data.experienceYears||'—'))} an(s) · Disponibilité : ${escapeHtml(data.availability||'—')}</p>
      <p class="muted">Prétention salariale : <b>${data.salary? Number(data.salary).toLocaleString('fr-FR')+' FCFA/mois' : '—'}</b></p>
    `;
  return `
  <div class="overlay" id="detail-overlay" onclick="if(event.target===this) closeDetail()">
    <div class="modal">
      <button class="modal-close" onclick="closeDetail()" aria-label="Fermer"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      ${gallery}
      ${body}
      <div class="btn-row">
        <button class="btn btn-teal" onclick="sendContactRequest('${escAttr(targetPhone)}','${escAttr(data.name)}')"><i class="fa-solid fa-handshake" aria-hidden="true"></i> Envoyer une demande de mise en relation</button>
        <button class="btn btn-danger" onclick="reportProfile()"><i class="fa-solid fa-flag" aria-hidden="true"></i> Signaler</button>
      </div>
    </div>
  </div>`;
}
function reportProfile(){
  showToast('Signalement envoyé à la modération (simulation).');
}
function openLightbox(src){
  state.lightboxSrc = src;
  render();
}
function closeLightbox(){
  const el = document.getElementById('lightbox-overlay');
  if(el){ el.classList.add('closing'); setTimeout(()=>{ state.lightboxSrc=null; render(); }, 180); }
  else { state.lightboxSrc=null; render(); }
}
function LightboxOverlay(){
  return `
  <div class="overlay lightbox-overlay" id="lightbox-overlay" onclick="if(event.target===this) closeLightbox()">
    <button class="modal-close lightbox-close" onclick="closeLightbox()" aria-label="Fermer l'aperçu"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    <img src="${state.lightboxSrc}" class="lightbox-img" alt="Photo agrandie">
  </div>`;
}
async function sendContactRequest(targetPhone, targetName){
  try{
    await api('POST', '/api/contacts', { to: targetPhone, toName: targetName });
    showToast('Demande envoyée !');
    closeDetail();
  }catch(e){
    showToast(e.message || 'Envoi impossible.');
  }
}

/* ---------- REQUESTS ---------- */
async function loadRequests(){
  try{
    const data = await api('GET', '/api/contacts');
    state.requestsIncoming = (data.incoming||[]).map(c => Object.assign({key: c._id}, c));
    state.requestsOutgoing = (data.outgoing||[]).map(c => Object.assign({key: c._id}, c));
  }catch(e){
    state.requestsIncoming = [];
    state.requestsOutgoing = [];
  }
  const root = document.getElementById('requests-root');
  if(root) root.innerHTML = renderRequests();
  else render();
}
function RequestsView(){
  loadRequests();
  return `<div id="requests-root"><div class="spinner-line"><div class="spin-ring"></div>Chargement…</div></div>`;
}
function renderRequests(){
  const inc = state.requestsIncoming, out = state.requestsOutgoing;
  return `
    <div class="card">
      <h2>Demandes reçues</h2>
      ${inc.length===0 ? '<p class="muted">Aucune demande reçue pour le moment.</p>' :
        inc.map(c=>`
          <div class="req-row">
            <div><b>${escapeHtml(c.fromName)}</b><div class="muted" style="font-size:12px;">Statut : ${c.status}</div></div>
            ${c.status==='pending' ? `
              <div class="btn-row" style="margin-top:0;">
                <button class="btn btn-teal" onclick="respondRequest('${escAttr(c.key)}','accepted')">Accepter</button>
                <button class="btn btn-ghost" onclick="respondRequest('${escAttr(c.key)}','declined')">Refuser</button>
              </div>` : `<span class="badge ${c.status==='accepted'?'badge-active':'badge-inactive'}">${c.status}</span>`}
          </div>`).join('')}
    </div>
    <div class="card">
      <h2>Demandes envoyées</h2>
      ${out.length===0 ? "<p class=\"muted\">Vous n'avez envoyé aucune demande.</p>" :
        out.map(c=>`
          <div class="req-row">
            <div><b>${escapeHtml(c.toName)}</b></div>
            <span class="badge ${c.status==='accepted'?'badge-active':c.status==='declined'?'badge-inactive':''}">${c.status}</span>
          </div>`).join('')}
    </div>
  `;
}
async function respondRequest(key, status){
  try{
    await api('POST', '/api/contacts/'+key+'/respond', { status });
    showToast(status==='accepted' ? 'Demande acceptée — vous pouvez maintenant discuter.' : 'Demande refusée.');
    loadRequests();
  }catch(e){ showToast(e.message || 'Action impossible.'); }
}

/* ---------- MESSAGES ---------- */
async function loadConversations(){
  try{
    const data = await api('GET', '/api/conversations');
    state.conversations = data.conversations || [];
  }catch(e){
    state.conversations = [];
  }
  const root = document.getElementById('messages-root');
  if(root) root.innerHTML = renderMessagesRoot();
  else render();
}
function MessagesView(){
  loadConversations();
  return `<div id="messages-root"><div class="spinner-line"><div class="spin-ring"></div>Chargement…</div></div>`;
}
function renderMessagesRoot(){
  if(state.activeConv) return renderChat();
  const convs = state.conversations;
  return `
  <div class="card">
    <h2>Mes conversations</h2>
    ${convs.length===0 ? '<div class="empty-state"><div class="empty-illustration"><i class="fa-solid fa-comments" aria-hidden="true"></i></div>Aucune conversation pour le moment. Acceptez ou envoyez une demande de mise en relation pour commencer à discuter.</div>' :
      `<div class="conv-list">${convs.map(c=>`<button class="conv-item" onclick="openConv('${escAttr(c.peerPhone)}','${escAttr(c.peerName)}')">${escapeHtml(c.peerName)}</button>`).join('')}</div>`}
  </div>`;
}
async function openConv(peerPhone, peerName){
  state.activeConv = { peerPhone, peerName };
  await loadChatMessages();
  render();
}
async function loadChatMessages(){
  try{
    const data = await api('GET', '/api/messages/'+encodeURIComponent(state.activeConv.peerPhone));
    state.chatMessages = data.messages || [];
  }catch(e){
    state.chatMessages = [];
  }
}
function renderChat(){
  const c = state.activeConv;
  const me = state.currentUser;
  return `
  <div class="card">
    <button class="btn-ghost" style="margin-bottom:10px;" onclick="state.activeConv=null; render();">← Retour aux conversations</button>
    <h2>${escapeHtml(c.peerName)}</h2>
    <div class="chat-box">
      <div class="chat-msgs" id="chat-msgs">
        ${state.chatMessages.length===0 ? "<div class=\"muted\" style=\"text-align:center;padding:20px;\">Dites bonjour pour commencer la discussion — c'est ici que vous pouvez parler du salaire et des conditions.</div>" :
          state.chatMessages.map(m=>`<div class="msg ${m.from===me.phone?'me':'them'}">${escapeHtml(m.text)}</div>`).join('')}
      </div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Écrire un message…" onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn btn-teal" onclick="sendMessage()"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Envoyer</button>
      </div>
    </div>
  </div>`;
}
async function sendMessage(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  const c = state.activeConv;
  try{
    await api('POST', '/api/messages/'+encodeURIComponent(c.peerPhone), { text });
    input.value='';
    await loadChatMessages();
    render();
    setTimeout(()=>{ const box=document.getElementById('chat-msgs'); if(box) box.scrollTop = box.scrollHeight; }, 30);
  }catch(e){ showToast(e.message || "Envoi impossible."); }
}

/* ---------- wipe demo data ---------- */
/* ---------- init ---------- */
render();
handlePaytechReturn();
restoreSession();

async function restoreSession(){
  try{
    const data = await api('GET', '/api/auth/me');
    if(data && data.success === 1){
      state.currentUser = data.user;
      goTo('dashboard');
    }
  }catch(e){
    // pas de session active — on reste sur l'écran d'accueil, c'est normal
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {
      // silencieux : l'app fonctionne très bien sans service worker (juste pas "installable")
    });
  });
}

// Gère le retour du navigateur après la page de paiement PayTech (success_url / cancel_url).
// ⚠️ Ceci est un confort d'affichage côté client uniquement. La vraie confirmation d'un
// paiement doit toujours venir du serveur (webhook IPN vérifié), jamais d'un paramètre
// d'URL, qui peut être modifié librement par n'importe qui. Voir server-paytech.js.
async function handlePaytechReturn(){
  const params = new URLSearchParams(window.location.search);
  const status = params.get('paytech_status');
  if(!status) return;
  window.history.replaceState({}, '', window.location.pathname);
  if(status === 'success'){
    showToast("Paiement reçu — vérification en cours...");
  } else if(status === 'cancel'){
    showToast('Paiement annulé.');
  }
}
